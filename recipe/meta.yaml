{% set version = "0.2.1" %}
{% set python_min = "3.11" %}

package:
  name: ansh
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/a/ansh/ansh-{{ version }}.tar.gz
  sha256: 392545d479e7ac244caa740c3f43301d48520ef780a97d84c169b75fbf68330d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - beartype >=0.23.0rc
    - h5py >=3.16
    - jinja2 >=3.1.6
    - numpy >=2.5
    - pyvista >=0.46.3
    - scikit-fem >=12

test:
  imports:
    - ansh
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://pypi.org/project/ansh/
  summary: A python package to define scalar and vector finite-element fields.
  doc_url: https://sankhya.codeberg.page/AnshPustak
  dev_url: https://codeberg.org/Sankhya/Ansh
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - swapneelap
